<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Lanterna dos Medos</title>
<meta name="description" content="Jogo terapêutico com 9 minijogos de tocar e arrastar para crianças de 9 a 12 anos conhecerem, medirem e enfrentarem os seus medos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: trilha vertical de 9 lanternas na tela inicial; cada etapa abre como um minijogo em tela única, coluna de até 780px. */
:root{
  --bg:#EDF0FA; --bg2:#E0E5F5; --surface:#FBFCFF; --field:#FFFFFF;
  --ink:#22254A; --muted:#565B85; --line:#CBD1E9;
  --lamp:#F4B13E; --on-lamp:#2B1C00; --lamp-soft:#FFF0CF; --lamp-ink:#7E4A00;
  --sea:#23807B; --sea-soft:#D8EFED;
  --night:#1B1E3D; --night-ink:#EEF0FF; --night-field:#272B54; --night-line:#474C80; --night-muted:#B6BADD; --night-shadow:#343A75;
  --glow:#FFF0CF; --party:#FFF0CF;
  --sea1:#7CCBE0; --sea2:#3A86BF; --sea3:#22508C; --tag-bg:#FFFFFF; --tag-ink:#1B1E3D;
  --t1:#49A874; --t2:#9CC656; --t3:#EDC540; --t4:#EE9443; --t5:#E0625C; --on-t:#14162B;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14162E; --bg2:#1C1F3F; --surface:#22264A; --field:#191C3A;
  --ink:#EEF0FF; --muted:#A9AED6; --line:#3B4072;
  --lamp:#FFC55C; --on-lamp:#2B1C00; --lamp-soft:#3A3322; --lamp-ink:#FFD88A;
  --sea:#62CEC5; --sea-soft:#1D3D45;
  --night:#0D0F24; --night-ink:#EEF0FF; --night-field:#1E2146; --night-line:#3B4072; --night-muted:#A9AED6; --night-shadow:#2B2F63;
  --glow:#F2E2BC; --party:#F2E2BC;
  --sea1:#4E9DB8; --sea2:#28649A; --sea3:#173A6B;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14162E; --bg2:#1C1F3F; --surface:#22264A; --field:#191C3A;
  --ink:#EEF0FF; --muted:#A9AED6; --line:#3B4072;
  --lamp:#FFC55C; --on-lamp:#2B1C00; --lamp-soft:#3A3322; --lamp-ink:#FFD88A;
  --sea:#62CEC5; --sea-soft:#1D3D45;
  --night:#0D0F24; --night-ink:#EEF0FF; --night-field:#1E2146; --night-line:#3B4072; --night-muted:#A9AED6; --night-shadow:#2B2F63;
  --glow:#F2E2BC; --party:#F2E2BC;
  --sea1:#4E9DB8; --sea2:#28649A; --sea3:#173A6B;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,5vw,2.2rem)} h2{font-size:1.3rem} h3{font-size:1.1rem}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:22px}
.sec{display:flex;flex-direction:column;gap:12px}
.lead{color:var(--muted);max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:.55em 1.15em;font-weight:800;min-height:46px}
.btn.pri{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.btn.ghost{background:transparent}
.btn.big{font-size:1.05rem;padding:.75em 1.4em}
.linkbtn{background:none;border:0;padding:.3em 0;font-weight:800;text-decoration:underline;color:var(--muted);min-height:44px}
.night{background:var(--night);color:var(--night-ink);--ink:var(--night-ink);--field:var(--night-field);--surface:var(--night-field);--line:var(--night-line);--muted:var(--night-muted)}
.hero{border-radius:28px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:12px;align-items:center}
.hero p{color:var(--night-muted);margin-top:8px;max-width:38ch}
.hero svg{width:100%;height:auto;display:block}
@media (max-width:560px){.hero{grid-template-columns:1fr}.hero svg{max-width:220px;justify-self:center;order:-1}}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:800;min-width:0}
.fld input,.inp{font-weight:600;background:var(--field);border:2px solid var(--line);border-radius:12px;padding:.55em .75em;min-height:46px;width:100%;color:var(--ink)}
::placeholder{color:var(--muted);opacity:.8}
.player{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
@media (max-width:560px){.player{grid-template-columns:1fr}}
details{border:2px dashed var(--line);border-radius:var(--r);padding:10px 14px}
details>summary{font-weight:800;cursor:pointer;min-height:30px}
details[open]>summary{margin-bottom:8px}
details .dbody{display:flex;flex-direction:column;gap:8px;color:var(--muted);font-size:.95rem}
details .dbody b{color:var(--ink)}
details ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.trail{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;position:relative}
.trail::before{content:"";position:absolute;left:26px;top:26px;bottom:26px;border-left:3px dashed var(--line)}
.st{position:relative;display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:0}
.node{width:56px;height:56px;border-radius:50%;background:var(--bg);border:2px solid var(--line);display:grid;place-items:center}
.st.lit .node{background:var(--lamp);border-color:var(--lamp)}
.stb{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st:hover .stb{border-color:var(--lamp)}
.stb b{font-family:var(--display);font-weight:600;font-size:1.12rem}
.stb small{color:var(--muted);font-size:.92rem}
.stb .got{font-weight:800;font-size:.82rem;color:var(--lamp-ink)}
.shelf{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}
@media (max-width:560px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.shelf figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.shelf figcaption{font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.2}
.shelf svg{width:100%;max-width:64px;height:auto}
.medal.off{opacity:.3}
.snav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.step{font-weight:800;color:var(--muted);font-size:.9rem;letter-spacing:.02em}
.shead{display:flex;flex-direction:column;gap:8px}
.shead h1:focus,h2:focus{outline:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.finish{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.hint{background:var(--lamp-soft);border-radius:12px;padding:10px 14px;font-weight:700}
.note{background:var(--sea-soft);border-radius:14px;padding:12px 14px}
.status{font-weight:800;color:var(--muted);min-height:1.5em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:.4em .9em;font-weight:700;min-height:44px;text-align:left}
.chip[aria-pressed="true"],.chip[aria-checked="true"]{background:var(--lamp-soft);border-color:var(--lamp)}
.chip[aria-pressed="true"]::before,.chip[aria-checked="true"]::before{content:"✓ ";font-weight:800}
.chip.rm::after{content:" ×";font-weight:800;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px;min-width:0}
.opt b{display:block;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.opt .chip{min-height:40px;padding:.25em .8em;font-size:.92rem}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--line);background:var(--c);padding:0}
.sw[aria-checked="true"]{border-color:var(--ink);transform:scale(1.12)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.steps3 button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:.4em .3em;font-weight:800;font-size:.9rem;min-height:44px}
.steps3 button[aria-current="step"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}

/* 1 caça aos medos */
.dark{position:relative;background:var(--night);border-radius:var(--r);padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;touch-action:none;overflow:hidden}
.shade{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle 100px at var(--lx) var(--ly),transparent 0,transparent 50%,var(--night) 100%)}
.fr{position:relative;background:var(--night-field);color:var(--night-ink);border:2px solid var(--night-line);border-radius:14px;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;font-weight:800;font-size:.86rem;line-height:1.2;text-align:center;min-width:0;overflow-wrap:anywhere}
.fr .ic{font-size:2rem;line-height:1.1}
.fr[aria-pressed="true"]{z-index:2;background:var(--lamp);color:var(--on-lamp);border-color:var(--lamp)}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.meas{align-items:center;text-align:center}
.bigic{width:calc(84px + var(--s)*24px);height:calc(84px + var(--s)*24px);border-radius:50%;display:grid;place-items:center;font-size:calc(2rem + var(--s)*.7rem);line-height:1;background:var(--bg2);transition:width .25s,height .25s,font-size .25s}
.stage{height:210px;display:grid;place-items:center}
.lvc1{background:var(--t1)}.lvc2{background:var(--t2)}.lvc3{background:var(--t3)}.lvc4{background:var(--t4)}.lvc5{background:var(--t5)}
input[type=range]{width:100%;max-width:420px;height:44px;accent-color:var(--lamp);margin:0}
.ticks{display:flex;justify-content:space-between;width:100%;max-width:420px;font-weight:800;color:var(--muted);padding-inline:6px}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pk{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-height:120px}
.pk .ic{font-size:2rem;line-height:1.1}
.pk b{line-height:1.2;overflow-wrap:anywhere}
.pk small{color:var(--muted);font-weight:700}
.pk[aria-checked="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.pk[aria-checked="true"] small{color:var(--on-lamp)}

/* 2 monstro */
.idcard{padding:0;overflow:hidden;gap:0}
.idhead{background:var(--night);color:var(--night-ink);padding:10px 16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:600;letter-spacing:.08em;font-size:.85rem;text-transform:uppercase}
.idbody{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:16px;padding:16px;align-items:start}
@media (max-width:600px){.idbody{grid-template-columns:1fr}}
.monbox{background:var(--bg2);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.mon{width:100%;max-width:200px;height:auto;display:block}
.monname{font-family:var(--display);font-weight:600;font-size:1.2rem;text-align:center;overflow-wrap:anywhere;min-height:1.4em}

/* 3 corpo */
.bodygrid{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:560px){.bodygrid{grid-template-columns:1fr}.bodygrid svg{max-width:180px;justify-self:center}}
.bodygrid svg{width:100%;height:auto}
.zone{cursor:pointer}
.zone .z{fill:var(--bg2);stroke:var(--line);stroke-width:3;transition:fill 3s ease}
.zone.on .z{fill:var(--lamp);stroke:var(--lamp-ink);transition:none}
.zone.on.calm .z{fill:var(--sea);stroke:var(--sea);transition:fill 3s ease}

/* 4 lanterna */
.lscene{width:100%;height:auto;display:block;border-radius:var(--r);touch-action:pan-y;cursor:ew-resize}
.bubble{border-radius:18px;padding:14px 16px;font-family:var(--display);font-weight:600;font-size:1.15rem}
.answers{display:flex;flex-direction:column;gap:8px}
.ans{border:2px solid var(--lamp);background:var(--lamp-soft);border-radius:14px;padding:.6em .9em;font-weight:800;text-align:left;min-height:48px}
.ans[aria-checked="true"]{background:var(--lamp);color:var(--on-lamp)}
.ans[aria-checked="true"]::before{content:"✓ "}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--lamp)}

/* 5 festa */
.party{width:100%;height:auto;display:block;border-radius:var(--r)}
.partygrid{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:640px){.partygrid{grid-template-columns:1fr}}
.partybox{position:relative;display:flex;flex-direction:column;gap:10px}
.dancer{transform-box:fill-box;transform-origin:50% 100%}
.fall{position:absolute;left:0;right:0;top:0;height:1px;pointer-events:none}

/* 6 mar */
.sea{position:relative;height:clamp(250px,52vw,340px);border-radius:var(--r);overflow:hidden;background:linear-gradient(var(--sea1),var(--sea2) 55%,var(--sea3))}
.sea .weed{position:absolute;left:0;right:0;bottom:0;width:100%;height:40%;display:block}
.fish{position:absolute;top:var(--y);left:var(--x);background:none;border:0;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.fish.r svg{transform:scaleX(-1)}
.fish .tag{background:var(--tag-bg);color:var(--tag-ink);border-radius:999px;padding:.05em .7em;font-weight:800;font-size:.85rem;white-space:nowrap;visibility:hidden}
.fish[aria-pressed="true"] .tag,.fish.fear .tag{visibility:visible}
.seasound{position:absolute;top:10px;right:10px;z-index:2;background:var(--tag-bg);color:var(--tag-ink);border:0;border-radius:999px;padding:.3em .9em;font-weight:800;font-size:.88rem;min-height:40px}
.breathrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center}
.breath{width:120px;height:120px;border-radius:50%;background:var(--sea-soft);border:4px solid var(--sea);display:grid;place-items:center;font-weight:800;text-align:center;font-size:.9rem;transform:scale(.7);padding:10px;transition:transform 6s ease-out}
.breath.in{transform:scale(1.05);transition:transform 4s ease-out}
.hold{width:150px;height:150px;border-radius:50%;border:0;background:var(--lamp);color:var(--on-lamp);font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2;padding:14px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hold.on{background:var(--sea);color:var(--tag-bg)}

/* 7 escada */
.poolc{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pc{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:800;text-align:left;min-height:64px;line-height:1.3}
.pc:hover{border-color:var(--lamp)}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rung{margin-inline-start:calc(var(--i)*3.5%);display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 12px;align-items:center}
.rung.lit{border-color:var(--lamp);background:var(--lamp-soft)}
.rn{width:40px;height:40px;border-radius:50%;background:var(--bg2);display:grid;place-items:center;font-family:var(--display);font-weight:600}
.rung.lit .rn{background:var(--lamp);color:var(--on-lamp)}
.rung .rt{font-weight:700;overflow-wrap:anywhere;min-width:0}
.rung .chip{min-height:40px;padding:.2em .8em;font-size:.9rem;white-space:nowrap}
@media (max-width:560px){.rung{margin-inline-start:calc(var(--i)*2%);grid-template-columns:40px minmax(0,1fr)}.rung .chip{grid-column:2;justify-self:start}}
.ex{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}

/* 8 subir a escada */
.tug{width:100%;height:auto;display:block;border-radius:var(--r);background:var(--bg2)}
.rung .rs{display:block;color:var(--muted);font-weight:700;font-size:.85rem}
.rbtns{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:560px){.rung .rbtns{grid-column:2;justify-content:flex-start}}
.hands{display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-weight:800;color:var(--muted);font-size:.9rem}
.wheelbox{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:16px;align-items:center}
.wheelbox svg{width:100%;height:auto;display:block}
@media (max-width:560px){.wheelbox{grid-template-columns:1fr}.wheelbox svg{max-width:190px;justify-self:center}}
#wheel{transform-box:fill-box;transform-origin:center}
.vres{display:flex;flex-direction:column;gap:6px;min-width:0}
.vres:focus,h3:focus{outline:none}
.vsay,.mission{font-family:var(--display);font-weight:600;font-size:1.2rem;line-height:1.3;background:var(--lamp-soft);border-radius:14px;padding:12px 14px;overflow-wrap:anywhere}
.vsay.v0{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;letter-spacing:.08em}
.vsay.v1{font-style:italic;font-size:1.45rem}
.vsay.v3{font-size:.85rem}
.vsay.v4{letter-spacing:.22em}

/* 9 kit */
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{aspect-ratio:1/1;border:2px solid var(--night-line);background:var(--night);color:var(--night-ink);border-radius:14px;display:grid;place-items:center;padding:6px;font-family:var(--display);font-weight:600;font-size:clamp(.78rem,2.6vw,1rem);line-height:1.15;text-align:center;min-width:0;overflow-wrap:anywhere}
.mc.up{background:var(--surface);color:var(--ink);border-color:var(--line)}
.mc.ok{background:var(--lamp);color:var(--on-lamp);border-color:var(--lamp)}
.ccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cc{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 12px;font-family:var(--display);font-weight:600;font-size:1.05rem;line-height:1.2;min-height:76px;text-align:left}
.cc[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:var(--on-lamp)}
.cc[aria-pressed="true"]::after{content:" ★"}
.sprayscene{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,150px);gap:8px;align-items:end;background:var(--bg2);border-radius:16px;padding:12px;position:relative;width:100%;max-width:460px;align-self:center}
.sprayscene .monwrap{display:grid;place-items:end center;height:210px}
.sprayscene .mon{transform-origin:50% 100%;transition:transform .6s ease}
.bottle{width:100%;height:auto;display:block}
.mist{position:absolute;right:140px;top:44px;width:1px;height:1px}
.sp{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--c);opacity:0}

.ov{position:fixed;inset:0;background:color-mix(in srgb,var(--night) 78%,transparent);display:grid;place-items:center;padding:16px;z-index:10}
.ovc{background:var(--surface);border-radius:26px;padding:26px 22px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ovc .row{justify-content:center}
.passrow{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:520px){.passrow{grid-template-columns:1fr}.passrow .monbox{max-width:170px}}
.kv{display:flex;flex-direction:column;gap:6px;min-width:0}
.kv p{overflow-wrap:anywhere}
.kv b{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.tf{background:var(--bg2);border-radius:999px;padding:.15em .7em;font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
hr{border:0;border-top:2px solid var(--bg2);margin:0;width:100%}

@media (prefers-reduced-motion:no-preference){
  .fish{animation:swimL var(--d) linear infinite;animation-delay:var(--dl)}
  .fish.r{animation-name:swimR}
  .fish[aria-pressed="true"],.fish:hover,.fish:focus-visible{animation-play-state:paused}
  @keyframes swimL{from{left:104%}to{left:-28%}}
  @keyframes swimR{from{left:-28%}to{left:104%}}
  .ovc .medal{animation:pop .5s ease-out}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .sp{animation:mist 1.4s ease-out forwards}
  @keyframes mist{0%{opacity:.95;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1.3)}}
  .dancer.go{animation:dance .6s ease-in-out 5}
  @keyframes dance{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-14px) rotate(-7deg)}75%{transform:translateY(-14px) rotate(7deg)}}
  .bottle.shake{animation:shake .5s ease-in-out}
  @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
  .zone.on:not(.calm) .z{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.6}}
  #tmon,#tkid,#tflag{transition:transform .5s ease}
  #wheel{transition:transform 2.2s cubic-bezier(.2,.8,.2,1)}
}
@media (prefers-reduced-motion:reduce){.breath,.breath.in,.zone .z,.zone.on.calm .z,.bigic,.sprayscene .mon{transition:none}}

function setupHold(h){var on=false;
  function down(e){if(e&&e.preventDefault)e.preventDefault();if(on)return;on=true;holdT=Date.now();h.classList.add('on');h.textContent='Puxando o ar…';var b=$('breath');b.classList.add('in');b.textContent='A onda cresce';}
  function up(){if(!on)return;on=false;var d=Date.now()-holdT;h.classList.remove('on');var b=$('breath');b.classList.remove('in');b.textContent='Solte devagar';
    if(d>=1500){breaths++;$('bcount').textContent=breaths>=5?'5 ondas. O mar está calmo.':breaths+' de 5 ondas';h.textContent=breaths>=5?'Mais uma onda, se quiser':'Segure para puxar o ar';}
    else{$('bcount').textContent='Essa foi curtinha. Segure um pouco mais na próxima.';h.textContent='Segure para puxar o ar';}}
  h.addEventListener('pointerdown',function(e){try{h.setPointerCapture(e.pointerId);}catch(_){}down(e);});
  h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up);h.addEventListener('contextmenu',function(e){e.preventDefault();});
  h.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&!e.repeat)down(e);else if(e.key===' '||e.key==='Enter')e.preventDefault();});
  h.addEventListener('keyup',function(e){if(e.key===' '||e.key==='Enter'){e.preventDefault();up();}});
  h.addEventListener('blur',up);}

  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;var e=Math.min(1,i/fade,(len-i)/fade);d[i]=last*3.2*(.25+.75*e);}
  var src=ctx.createBufferSource();src.buffer=buf;src.loop=true;var lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=850;var g=ctx.createGain();g.gain.value=0;
  src.connect(lp);lp.connect(g);g.connect(ctx.destination);g.gain.linearRampToValueAtTime(.45,ctx.currentTime+3);src.start();audio={ctx:ctx,g:g};}catch(e){audio=null;}}

document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.disabled)return;var a=b.dataset.act,v=b.dataset.v,i=b.dataset.i,k=b.dataset.k,p=P(),n=parseInt(v,10);

    case 'mprev':case 'mnext':var cur=p.fears[mIdx],rg=$('rng');if(cur&&rg)cur.level=+rg.value-1;save();
      if(a==='mnext'&&mIdx>=p.fears.length-1){mStep=2;render(false);focusId('');return;}mIdx+=a==='mnext'?1:-1;render(false);focusId('');return;
    case 'focus':p.focus=i;break;

    case 'part':if(bPhase==='calm'){if(p.body.parts.indexOf(v)<0||p.body.calm.indexOf(v)>-1)return;var g=app.querySelector('g.zone[data-v="'+v+'"]');if(g)g.classList.add('calm');p.body.calm.push(v);save();$('bmsg').textContent='Solte o ar devagar…';

      toggle(p.body.parts,v);p.body.calm=p.body.calm.filter(function(x){return p.body.parts.indexOf(x)>-1;});save();render(false);var z=app.querySelector('button[data-act="part"][data-v="'+v+'"]');if(z)z.focus({preventScroll:true});return;
    case 'sens':toggle(p.body.sens,n);break;
    /* 4 */
    case 'ans':p.lant.ans[lq]=n;break;
    case 'lq':lq=Math.max(0,Math.min(3,lq+n));render(false);focusId('lqh');return;

    case 'clpull':case 'clshout':var r1=clR(cRung);if(r1.dropped)return;if(a==='clpull')r1.pulls=(r1.pulls||0)+1;else r1.shouts=(r1.shouts||0)+1;var tn=clN(r1),tk=a==='clpull'?r1.pulls:r1.shouts;
      $('tmsg').textContent=(a==='clpull'?['Você puxou. Ele puxou de volta.','Você puxou mais forte. Ele também.','Quanto mais você puxa, mais ele puxa.']:['Você gritou de volta. Ele gritou mais alto.','Você discutiu com ele. Ele cresceu.','Quanto mais você discute, mais ele cresce.'])[Math.min(tk-1,2)]+(tn>=3?' As suas mãos estão cansadas. O que mais dá para fazer com essa corda?':'');

    /* 9 */
    case 'flip':if(busy||flipped.indexOf(n)>-1||p.kit.found.indexOf(deck[n])>-1)return;flipped.push(n);
      if(flipped.length===2){if(deck[flipped[0]]===deck[flipped[1]]){p.kit.found.push(deck[n]);flipped=[];save();if(p.kit.found.length>=6){rer(b);return;}}
