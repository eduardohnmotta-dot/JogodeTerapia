<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Músculo do Travão</title>
<meta name="description" content="Sessão online de treino do controlo inibitório (12 anos): Parar – Pensar – Agir.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  /* ADHD-friendly choices: calm neutral background, one strong accent, one task per screen,
     big rounded type, go/stop never told apart by colour alone (shape + word too), no flashing. */
  :root{
    --bg:#F5F3EE; --surface:#FFFFFF; --surface-2:#ECE8E0; --ink:#1F2A33; --ink-soft:#5A6570; --border:#DED8CC;
    --primary:#2F5BD3; --on-primary:#FFFFFF; --accent:#E8743B; --violet:#6B60C9; --amber:#C98A12;
    --go:#1E8A4C; --stop:#C8372D; --on-signal:#FFFFFF;
    --shadow:0 6px 18px rgba(31,42,51,.08); --shadow-lg:0 16px 40px rgba(31,42,51,.14);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12171D; --surface:#1A2129; --surface-2:#232C36; --ink:#EEF2F5; --ink-soft:#A5B0BA; --border:#2F3A46;
      --primary:#86A6FF; --on-primary:#0E1520; --accent:#F4A064; --violet:#A89EF2; --amber:#E9BE55;
      --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12171D; --surface:#1A2129; --surface-2:#232C36; --ink:#EEF2F5; --ink-soft:#A5B0BA; --border:#2F3A46;
    --primary:#86A6FF; --on-primary:#0E1520; --accent:#F4A064; --violet:#A89EF2; --amber:#E9BE55;
    --shadow:0 6px 18px rgba(0,0,0,.35); --shadow-lg:0 16px 40px rgba(0,0,0,.5);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font-family:"Nunito",system-ui,-apple-system,sans-serif; font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Fredoka","Nunito",system-ui,sans-serif; font-weight:600; text-wrap:balance; margin:0}
  p{margin:0}
  button,input,textarea{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--primary); outline-offset:2px}

  .app{max-width:1100px; margin:0 auto; padding-inline:16px; padding-block:12px 32px; display:flex; flex-direction:column; gap:12px}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .badge{width:48px; height:48px; flex:0 0 auto; border-radius:15px; background:var(--primary); display:grid; place-items:center; font-size:1.6rem; box-shadow:var(--shadow)}
  .brand h1{font-size:1.4rem; line-height:1.15}
  .brand .sub{color:var(--ink-soft); font-weight:700; font-size:.88rem}
  .tools{display:flex; align-items:center; gap:8px}
  .seg{display:inline-flex; flex-wrap:wrap; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:3px; gap:3px}
  .seg button{border:0; background:transparent; border-radius:10px; padding:7px 12px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:.9rem; cursor:pointer; color:var(--ink-soft)}
  .seg button[aria-pressed="true"]{background:var(--primary); color:var(--on-primary)}
  .icon{border:1px solid var(--border); background:var(--surface); width:42px; height:42px; border-radius:12px; font-size:1rem; cursor:pointer; box-shadow:var(--shadow); display:grid; place-items:center}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:50px; padding:0 18px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.02rem; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s ease}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.45; cursor:default; box-shadow:none}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
  .btn.ok{background:var(--go); border-color:var(--go); color:var(--on-signal)}
  .btn.miss{background:var(--surface); border:2px solid var(--violet); color:var(--violet)}
  .btn.go{background:var(--go); border-color:var(--go); color:var(--on-signal)}
  .btn.stop{background:var(--stop); border-color:var(--stop); color:var(--on-signal)}
  .btn.ghost{box-shadow:none; background:transparent}
  .btn.big{min-height:60px; font-size:1.2rem; border-radius:16px}
  .btn.small{min-height:42px; font-size:.92rem; padding:0 14px}
  kbd{font-family:"Nunito",sans-serif; font-weight:800; font-size:.72rem; padding:1px 6px; border-radius:6px; border:1px solid currentColor; opacity:.75}
  .hide-narrow{display:inline}
  @media (max-width:560px){ .hide-narrow{display:none} }

  /* phase stepper: always shows where we are and what's left */
  .steps ol{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
  .step{width:100%; display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface); cursor:pointer; text-align:left; min-height:48px}
  .step .n{flex:0 0 28px; height:28px; border-radius:50%; display:grid; place-items:center; font-family:"Fredoka",sans-serif; font-weight:700; font-size:.9rem; background:var(--surface-2); color:var(--ink-soft)}
  .step .lb{font-family:"Fredoka",sans-serif; font-weight:600; font-size:.9rem; line-height:1.15; color:var(--ink-soft)}
  .step.done .n{background:color-mix(in srgb, var(--go) 18%, var(--surface)); color:var(--go)}
  .step.on{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 12%, var(--surface))}
  .step.on .n{background:var(--primary); color:var(--on-primary)}
  .step.on .lb{color:var(--ink)}
  @media (max-width:760px){ .step:not(.on) .lb{display:none} .step{justify-content:center; padding:8px} .steps ol{display:flex} .steps li{flex:0 0 auto} .steps li:has(.on){flex:1 1 auto} .step.on{justify-content:flex-start} }

  /* visible time (time blindness): phase time against its target */
  .clock{display:flex; align-items:center; gap:12px; flex-wrap:wrap; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums; font-size:.92rem}
  .cbar{flex:1 1 200px; height:10px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
  .cbar i{display:block; height:100%; width:0; background:var(--primary); border-radius:99px; transition:width .5s linear}
  .clock.over .cbar i{background:var(--amber)}
  .clock.over #clockTxt b{color:var(--amber)}

  /* stage = what the young person sees */
  .stage{background:var(--surface); border:1px solid var(--border); border-radius:24px; box-shadow:var(--shadow-lg); padding:clamp(16px, 3vw, 32px); min-height:min(56vh, 600px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center}
  .stage h2{font-size:clamp(1.5rem, 3.4vw, 2.2rem)}
  .lead{font-size:clamp(1.05rem, 2.2vw, 1.3rem); max-width:40ch; color:var(--ink-soft); font-weight:600}
  .quote{font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(1.35rem, 3.2vw, 2rem); line-height:1.25; max-width:30ch; text-wrap:balance}
  .quote::before{content:"“"} .quote::after{content:"”"}
  .toprow{align-self:stretch; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap}
  .ptitle{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--ink-soft); font-size:1rem}

  .gauge{width:min(290px, 70%); height:auto; overflow:visible}
  .gauge path{fill:none; stroke-width:20; transition:opacity .2s}
  .gauge.set path{opacity:.3} .gauge.set path.on{opacity:1}
  .gauge .needle{transform-origin:100px 100px; transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
  .gauge .needle line{stroke:var(--ink); stroke-width:6; stroke-linecap:round}
  .gauge.unset .needle{opacity:.2}
  .gauge circle{fill:var(--ink)}
  .motors{display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:8px; width:100%; max-width:640px}
  .mbtn{display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 4px; border-radius:16px; border:2px solid var(--border); background:var(--surface-2); cursor:pointer; min-height:96px; justify-content:center}
  .mbtn .e{font-size:1.9rem; line-height:1.1}
  .mbtn b{font-family:"Fredoka",sans-serif; font-size:1.15rem}
  .mbtn small{font-weight:700; font-size:.8rem; color:var(--ink-soft); line-height:1.15}
  .mbtn[aria-pressed="true"]{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 14%, var(--surface))}
  .cmp{font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.15rem}

  /* brake strength: progress that only goes up (misses never take points away) */
  .meter{display:inline-flex; align-items:center; gap:10px; padding:8px 14px; border-radius:999px; background:var(--surface-2); border:1px solid var(--border); font-weight:700; font-size:.92rem}
  .meter b{font-family:"Fredoka",sans-serif; font-size:1.25rem; font-variant-numeric:tabular-nums}
  .meter .mbar{width:80px; height:8px; border-radius:99px; background:var(--surface); overflow:hidden; border:1px solid var(--border)}
  .meter .mbar i{display:block; height:100%; background:var(--go); border-radius:99px; transition:width .25s ease}
  .meter small{color:var(--ink-soft); font-weight:700}
  .meter.pop{animation:pop .5s ease}

  .prompt{display:flex; flex-direction:column; align-items:center; gap:4px}
  .prompt .e{font-size:clamp(3.5rem, 10vw, 6rem); line-height:1}
  .prompt .w{font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(3rem, 11vw, 6.5rem); line-height:1.05; text-transform:uppercase; letter-spacing:.02em}
  .say{font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.3rem; color:var(--primary)}
  .pairs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
  .pair{padding:6px 14px; border-radius:999px; background:var(--surface-2); font-weight:700}
  .rules{display:flex; flex-direction:column; gap:12px; width:100%; max-width:720px}
  .rule{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:12px; padding:16px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border)}
  .rule .side{display:flex; flex-direction:column; align-items:center; gap:4px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(1.05rem, 2.6vw, 1.45rem); line-height:1.2}
  .rule .side .e{font-size:clamp(2.2rem, 6vw, 3.2rem); line-height:1}
  .rule .arrow{font-size:1.8rem; color:var(--primary); font-weight:800}
  .rule .side.you{color:var(--primary)}

  /* the "reset" moment: calm violet, never alarm red, no shaming */
  .reset{display:flex; flex-direction:column; align-items:center; gap:10px; padding:28px; border-radius:24px; background:color-mix(in srgb, var(--violet) 12%, var(--surface)); border:2px solid color-mix(in srgb, var(--violet) 45%, transparent); max-width:620px}
  .reset .e{font-size:3rem; line-height:1}
  .reset small{font-weight:700; color:var(--ink-soft); font-size:1rem}
  .reset b{font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(1.5rem, 4vw, 2.3rem); color:var(--violet); line-height:1.2}
  .reset.strip{flex-direction:row; padding:12px 18px; gap:12px; border-radius:18px}
  .reset.strip .e{font-size:1.8rem} .reset.strip b{font-size:1.3rem}

  /* traffic light: readable from across the room */
  .signal{align-self:stretch; min-height:min(44vh, 460px); border-radius:28px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--on-signal); padding:20px}
  .signal.go{background:var(--go)} .signal.stop{background:var(--stop)}
  .signal svg{width:clamp(110px, 22vmin, 200px); height:auto}
  .signal .w{font-family:"Fredoka",sans-serif; font-weight:700; font-size:clamp(3rem, 12vw, 7rem); line-height:1; letter-spacing:.03em}
  .signal .d{font-size:clamp(1.1rem, 2.6vw, 1.5rem); font-weight:700; opacity:.95}
  .follow{font-weight:700; color:var(--ink-soft); font-size:1.05rem}
  .follow b{color:var(--ink)}
  .ready .e{font-size:4.5rem; line-height:1}

  .talk{max-width:640px; padding:24px; border-radius:22px; background:color-mix(in srgb, var(--primary) 10%, var(--surface)); border:1.5px solid color-mix(in srgb, var(--primary) 35%, transparent); font-family:"Fredoka",sans-serif; font-weight:500; font-size:clamp(1.25rem, 3vw, 1.7rem); line-height:1.35; text-wrap:balance}
  .talk .e{font-size:2.4rem; display:block; margin-bottom:6px}

  /* stop - think - act */
  .dilemma{max-width:760px; display:flex; flex-direction:column; gap:8px; align-items:center}
  .tag{display:inline-flex; gap:6px; align-items:center; padding:5px 12px; border-radius:999px; background:var(--surface-2); font-family:"Fredoka",sans-serif; font-weight:600; font-size:.95rem}
  .dilemma p{font-size:clamp(1.15rem, 2.8vw, 1.55rem); font-weight:600; line-height:1.4; text-wrap:balance}
  .ppa{display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; width:100%; max-width:860px}
  .pstep{padding:16px 12px; border-radius:20px; border:2px solid var(--border); background:var(--surface-2); display:flex; flex-direction:column; align-items:center; gap:6px; opacity:.4; transition:opacity .2s}
  .pstep .e{font-size:2.4rem; line-height:1}
  .pstep b{font-family:"Fredoka",sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:.04em}
  .pstep small{font-weight:600; font-size:.95rem; color:var(--ink-soft); line-height:1.3}
  .pstep.past{opacity:.75}
  .pstep.on{opacity:1; border-color:var(--primary); background:color-mix(in srgb, var(--primary) 10%, var(--surface))}
  @media (max-width:640px){ .ppa{grid-template-columns:1fr} .pstep:not(.on){flex-direction:row; justify-content:center; padding:8px} .pstep:not(.on) small{display:none} .pstep:not(.on) .e{font-size:1.4rem} }
  .breath{width:150px; height:150px; border-radius:50%; background:color-mix(in srgb, var(--primary) 18%, var(--surface)); border:4px solid var(--primary); display:grid; place-items:center; animation:breath 8s ease-in-out infinite}
  .breath span{font-family:"Fredoka",sans-serif; font-weight:600; font-size:1.1rem; color:var(--primary)}
  .question{font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(1.2rem, 3vw, 1.6rem)}

  .mission{max-width:640px; padding:22px; border-radius:22px; border:2px dashed var(--accent); background:color-mix(in srgb, var(--accent) 9%, var(--surface)); display:flex; flex-direction:column; gap:6px; align-items:center}
  .mission .lbl{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--accent); letter-spacing:.04em; text-transform:uppercase; font-size:.9rem}
  .mission p{font-family:"Fredoka",sans-serif; font-weight:600; font-size:clamp(1.2rem, 3vw, 1.6rem); line-height:1.3}
  .mission p.empty{color:var(--ink-soft); font-weight:500}
  .choices{display:flex; flex-direction:column; gap:8px; width:100%; max-width:640px}
  .choice{text-align:left; padding:14px 16px; border-radius:16px; border:2px solid var(--border); background:var(--surface-2); cursor:pointer; font-weight:700; font-size:1.02rem; min-height:56px}
  .choice[aria-pressed="true"]{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface))}
  input[type="text"], textarea{width:100%; font-size:1.02rem; padding:12px 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--ink)}
  input[type="text"]{min-height:50px}
  input[type="text"]:focus, textarea:focus{border-color:var(--primary); outline:none}

  /* dock = therapist controls, visually quieter than the stage */
  .dock{background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:12px; display:flex; flex-direction:column; gap:10px}
  .dhead{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap}
  .dlabel{font-family:"Fredoka",sans-serif; font-weight:600; font-size:.85rem; color:var(--ink-soft); letter-spacing:.03em; text-transform:uppercase}
  .row{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .row .btn{flex:1 1 150px}
  .row .grow{flex:1 1 auto}
  .counts{font-weight:700; color:var(--ink-soft); font-size:.9rem; font-variant-numeric:tabular-nums}
  .nav{display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--border); padding-top:10px}
  .toggle{display:flex; gap:8px; align-items:center; cursor:pointer; font-weight:700; font-size:.95rem}
  .toggle input{width:20px; height:20px; margin:0; accent-color:var(--primary)}
  .fine{color:var(--ink-soft); font-size:.86rem}
  .confirm{border:1.5px solid var(--violet); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; background:color-mix(in srgb, var(--violet) 8%, var(--surface))}

  /* start */
  .start{width:100%; max-width:560px; display:flex; flex-direction:column; gap:16px; text-align:left}
  .start h2{text-align:center}
  .start .lead{text-align:center; margin-inline:auto}
  .resume{display:flex; flex-direction:column; gap:10px; padding:16px; border-radius:18px; background:color-mix(in srgb, var(--primary) 9%, var(--surface)); border:1.5px solid color-mix(in srgb, var(--primary) 35%, transparent)}
  .fl{font-weight:800; font-size:.95rem}

  dialog{border:1px solid var(--border); border-radius:22px; background:var(--surface); color:var(--ink); padding:0; width:min(640px, calc(100% - 32px)); max-height:calc(100% - 48px); box-shadow:var(--shadow-lg); overflow:auto}
  dialog::backdrop{background:rgba(15,20,26,.5)}
  .phead{position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; background:var(--surface); border-bottom:1px solid var(--border)}
  .pbody{padding:18px; display:flex; flex-direction:column; gap:12px}
  .pbody h3{font-size:1.1rem; margin-top:6px}
  .pbody ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:6px}
  .pbody .goal{font-weight:700}

  /* voice meter: shows the young person their voice is getting through (volume only, nothing is recorded) */
  .icon[aria-pressed="true"]{background:var(--go); border-color:var(--go)}
  .micmsg{margin:0; padding:10px 14px; border-radius:14px; background:color-mix(in srgb, var(--violet) 10%, var(--surface)); border:1.5px solid color-mix(in srgb, var(--violet) 40%, transparent); font-weight:700; font-size:.92rem}
  .voice{display:inline-flex; align-items:center; gap:12px; padding:8px 16px; border-radius:999px; background:var(--surface-2); border:1.5px solid var(--border); font-weight:700; color:var(--ink-soft); --v:0}
  .voice .bars{display:flex; align-items:center; gap:4px; height:32px}
  .voice .bars i{width:7px; border-radius:99px; background:var(--ink-soft); height:calc(6px + var(--v) * 26px); transition:height .08s linear}
  .voice .bars i:nth-child(2), .voice .bars i:nth-child(4){height:calc(6px + var(--v) * 18px)}
  .voice .bars i:nth-child(1), .voice .bars i:nth-child(5){height:calc(6px + var(--v) * 10px)}
  .voice.live{border-color:var(--go); color:var(--go)}
  .voice.live .bars i{background:var(--go)}

  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes breath{0%,100%{transform:scale(.62)}50%{transform:scale(1)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important; transition-duration:0s!important}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="badge" aria-hidden="true">🏎️</span>
      <div>
        <h1 id="hTitle">Músculo do Travão</h1>
        <div class="sub" id="hSub"></div>
      </div>
    </div>
    <div class="tools">
      <div class="seg" role="group" id="langSeg">
        <button id="lPT" type="button">PT</button>
        <button id="lEN" type="button">EN</button>
      </div>
      <button class="icon" id="themeBtn" type="button">🌙</button>
      <button class="icon" id="micBtn" type="button" aria-pressed="false" hidden>🎤</button>
      <button class="btn small" id="guideBtn" type="button"><span aria-hidden="true">📋</span><span class="hide-narrow" data-t="guide">Guião</span></button>
    </div>
  </header>
  <nav class="steps" id="steps"></nav>
  <p class="micmsg" id="micMsg" role="status" hidden></p>
  <div class="clock" id="clock"><span id="clockTxt"></span><div class="cbar"><i id="clockBar"></i></div></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <section class="dock" id="dock"></section>
</div>

<dialog id="guide">
  <div class="phead">
    <h2 id="gTitle"></h2>
    <button class="icon" id="guideClose" type="button">✕</button>
  </div>
  <div class="pbody" id="guideBody"></div>
</dialog>

<script>

var KEY="musculo_travao_v1", PREFS="musculo_travao_prefs", THEME="musculo_travao_theme";
var L="pt", S=null, view="start", saved=null;
// Screen-only state (not saved).
var U={word:null, fail:false, failT:0, auto:false, autoT:0, micro:false, breathT:0, pop:false, confirm:false};

function $(s){ return document.querySelector(s); }
function t(k,v){ var s=T[L][k]; if(s==null) s=T.pt[k]; if(s==null) s=k; if(v && typeof s==="string") for(var x in v) s=s.split("{"+x+"}").join(v[x]); return s; }
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function rnd(a,b){ return a+Math.random()*(b-a); }
function fmt(ms){ var s=Math.max(0,Math.floor(ms/1000)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function locale(){ return L==="pt"?"pt-PT":"en-GB"; }

/* ---------- session state (this browser only) ---------- */
function newSession(name){
  var now=Date.now();
  return {v:1, name:name, started:now, seen:now, phase:0, pt:[0,0,0,0,0], at:now, m0:null, m1:null,
    rev:{lvl:1, pairs:2, show:true, log:[]}, sem:{cur:null, rate:1, log:[]},
    ppa:{i:0, step:0, done:[], ans:{}}, mstep:0, mis:{pick:null, custom:""}};
}
function load(){ try{ var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d && d.v===1 && Array.isArray(d.pt)) return d; }catch(e){} return null; }
function save(){ if(!S) return; S.seen=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function phaseMs(i){ return S.pt[i]+(i===S.phase?Date.now()-S.at:0); }
function totalMs(){ var n=0; for(var i=0;i<5;i++) n+=phaseMs(i); return n; }
function brakes(){
  var n=0;
  S.rev.log.forEach(function(e){ if(e.ok) n++; });
  S.sem.log.forEach(function(e){ if(e.ok===true) n++; });
  return n;
}

function begin(){
  var inp=$("#newName"), name=((inp && inp.value)||"").trim().slice(0,30) || t("anon");
  S=newSession(name); view="session"; U.word=null; save(); renderAll();
}
function resume(){
  S=saved;
  // Don't count the time the tab was closed.
  S.at=Date.now()-Math.max(0, S.seen-S.at);
  view="session"; renderAll();
}
function goPhase(i){
  if(i<0 || i>4 || i===S.phase) return;
  stopAuto(); clearTimeout(U.failT); U.fail=false; U.micro=false; U.confirm=false;
  S.pt[S.phase]+=Date.now()-S.at; S.phase=i; S.at=Date.now();
  save(); renderAll();
  window.scrollTo(0,0);
}

/* ---------- phase 2: reverse rule ---------- */
function newWord(){
  var n=S.rev.pairs, prev=U.word, w;
  do{ w={p:Math.floor(Math.random()*n), s:Math.random()<.5?0:1}; } while(prev && w.p===prev.p && w.s===prev.s);
  U.word=w;
}
function markRev(ok){
  S.rev.log.push({l:S.rev.lvl, ok:ok});
  clearTimeout(U.failT); U.fail=!ok;
  if(ok){ newWord(); bump(); }
  else U.failT=setTimeout(function(){ U.fail=false; newWord(); renderStage(); }, 2600);
  save(); renderStage(); renderDock();
}

/* ---------- phase 3: traffic light ---------- */
function signal(c, fake){
  S.sem.cur={c:c, fake:!!fake};
  S.sem.log.push({c:c, fake:!!fake, ok:null});
  U.micro=false; U.fail=false; clearTimeout(U.failT);
  if(U.auto){ clearTimeout(U.autoT); U.autoT=setTimeout(autoStep, c==="go"?rnd(3000,6000):rnd(2500,4500)); }
  save(); renderStage(); renderDock();
}
function fakeSignal(){ var cur=S.sem.cur; signal(cur && cur.c==="stop"?"go":"stop", true); }
function autoStep(){
  if(!U.auto || !S || S.phase!==2) return;
  var cur=S.sem.cur, fake=!!cur && Math.random()<[0,.25,.45][S.sem.rate];
  signal(cur && cur.c==="go"?"stop":"go", fake);
}
function toggleAuto(){ if(U.auto){ stopAuto(); renderDock(); } else { U.auto=true; autoStep(); } }
function stopAuto(){ U.auto=false; clearTimeout(U.autoT); }
function markSem(ok){
  var last=S.sem.log[S.sem.log.length-1]; if(!last) return;
  var was=last.ok; last.ok=ok;
  if(ok && was!==true) bump();
  clearTimeout(U.failT); U.fail=!ok;
  if(!ok) U.failT=setTimeout(function(){ U.fail=false; renderStage(); }, 2600);
  save(); renderStage(); renderDock();
}
function bump(){ U.pop = brakes()%10===0; }

/* ---------- phase 4: stop-think-act ---------- */
function nextStep(){
  var p=S.ppa;
  if(p.step<3){ p.step++; if(p.step===3 && p.done.indexOf(DILEMMAS[p.i].id)<0) p.done.push(DILEMMAS[p.i].id); }
  else { p.i=(p.i+1)%DILEMMAS.length; p.step=0; }
  save(); renderStage(); renderDock();
}

/* ---------- rendering ---------- */
function renderAll(){
  var on=view==="session";
  $("#hTitle").textContent=t("title");

/* ---------- microphone: volume only, processed in the browser, never recorded or sent ---------- */
var MIC={on:false, stream:null, ctx:null, raf:0};
var micKey="";
function micMsg(k){ var el=$("#micMsg"); micKey=k; el.textContent=k?t(k):""; el.hidden=!k; }
function micStart(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !(window.AudioContext||window.webkitAudioContext)){ micMsg("micNone"); return; }
  // Create the audio context inside the click itself: Safari keeps it muted if it's created after the permission prompt.
  var ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.resume) ctx.resume();
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}).then(function(stream){
    var an=ctx.createAnalyser(), buf;
    an.fftSize=1024; buf=new Uint8Array(an.fftSize);
    ctx.createMediaStreamSource(stream).connect(an);
    MIC={on:true, stream:stream, ctx:ctx, raf:0};
    micMsg(""); micButton(); renderStage();
    var level=0;
    (function loop(){
      if(!MIC.on) return;
      an.getByteTimeDomainData(buf);
      var sum=0; for(var i=0;i<buf.length;i++){ var x=(buf[i]-128)/128; sum+=x*x; }
      // RMS of normal speech sits around .02–.2; scale so talking fills most of the meter.
      var v=Math.min(1, Math.sqrt(sum/buf.length)*6);
      level = v>level ? v : level*.85+v*.15;
      var live=level>.18;
      Array.prototype.forEach.call(document.querySelectorAll(".voice"), function(el){
        el.style.setProperty("--v", level.toFixed(3));
        if(live!==el.classList.contains("live")){ el.classList.toggle("live", live); el.querySelector(".vt").textContent=t(live?"micLive":"micHear"); }
      });
      MIC.raf=requestAnimationFrame(loop);
    })();
  }, function(){ ctx.close(); micMsg("micDenied"); });
}
function micStop(){
  cancelAnimationFrame(MIC.raf);
  if(MIC.stream) MIC.stream.getTracks().forEach(function(tr){ tr.stop(); });
  if(MIC.ctx) MIC.ctx.close();
  MIC={on:false, stream:null, ctx:null, raf:0};
  micButton(); renderStage();
}

  }).join("; ");
  return [
    t("sumHead",{p:S.name, d:new Date(S.started).toLocaleDateString(locale())}),
    t("sumTime",{t:fmt(totalMs()), x:per}),
    t("sumMotor",{a:S.m0||t("none"), b:S.m1||t("none")}),
    t("sumRev",{a:cnt(rev,function(e){ return e.ok; }), b:cnt(rev,function(e){ return !e.ok; }),
      c:cnt(rev,function(e){ return e.l===1 && e.ok; }), d:cnt(rev,function(e){ return e.l===1 && !e.ok; }),
      e:cnt(rev,function(e){ return e.l===2 && e.ok; }), f:cnt(rev,function(e){ return e.l===2 && !e.ok; })}),
    t("sumSem",{n:sem.length, a:cnt(sem,function(e){ return e.ok===true; }), b:cnt(sem,function(e){ return e.ok===false; }),
      c:cnt(sem,function(e){ return e.fake && e.ok===true; }), d:cnt(sem,function(e){ return e.fake && e.ok===false; })}),
    t("sumPpa",{x:ppa||t("none")}),

}

/* ---------- events ---------- */
function act(a, v){
  if(a==="begin") begin();
  else if(a==="resume") resume();
  else if(a==="phase") goPhase(+v);
  else if(a==="prev") goPhase(S.phase-1);
  else if(a==="next") goPhase(S.phase+1);
  else if(a==="motor"){ if(S.phase===0) S.m0=+v; else S.m1=+v; save(); renderStage(); }
  else if(a==="lvl"){ S.rev.lvl=+v; U.fail=false; save(); renderStage(); renderDock(); }
  else if(a==="pairs"){ S.rev.pairs=+v; U.word=null; save(); renderStage(); renderDock(); }
  else if(a==="ok") S.phase===1 ? markRev(true) : markSem(true);
  else if(a==="miss") S.phase===1 ? markRev(false) : markSem(false);
  else if(a==="go") signal("go",false);
  else if(a==="stop") signal("stop",false);
  else if(a==="fake") fakeSignal();
  else if(a==="auto") toggleAuto();
  else if(a==="rate"){ S.sem.rate=+v; save(); renderDock(); }
  else if(a==="micro"){ U.micro=!U.micro; if(U.micro) stopAuto(); renderStage(); renderDock(); }
  else if(a==="dilemma"){ S.ppa.i=+v; S.ppa.step=0; save(); renderStage(); renderDock(); }
  else if(a==="step") nextStep();
  else if(a==="mstep"){ S.mstep=+v; U.confirm=false; save(); renderStage(); renderDock(); }
  else if(a==="mission"){ S.mis.pick=v; save(); renderStage(); }
  else if(a==="copy") doCopy();
  else if(a==="newS"){ U.confirm=true; renderDock(); }
  else if(a==="newNo"){ U.confirm=false; renderDock(); }
  else if(a==="newYes"){ if(MIC.on) micStop(); try{ localStorage.removeItem(KEY); }catch(e){} S=null; saved=null; view="start"; U.confirm=false; renderAll(); }
}
function bind(){
  $("#lPT").addEventListener("click", function(){ setLang("pt"); });
  $("#lEN").addEventListener("click", function(){ setLang("en"); });
  $("#themeBtn").addEventListener("click", toggleTheme);
  $("#micBtn").addEventListener("click", function(){ if(MIC.on) micStop(); else micStart(); });
  var guide=$("#guide");
  $("#guideBtn").addEventListener("click", function(){ renderGuide(); if(guide.showModal) guide.showModal(); else guide.setAttribute("open",""); });
  $("#guideClose").addEventListener("click", function(){ guide.close(); });
  guide.addEventListener("click", function(e){ if(e.target===guide) guide.close(); });

  document.addEventListener("click", function(e){
    var b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
    act(b.getAttribute("data-act"), b.getAttribute("data-v"));
  });
  document.addEventListener("input", function(e){
    if(!S) return;
    if(e.target.id==="customMission"){ S.mis.custom=e.target.value; S.mis.pick=e.target.value.trim()?"custom":S.mis.pick==="custom"?null:S.mis.pick; save();
      Array.prototype.forEach.call(document.querySelectorAll('[data-act="mission"]'), function(el){ el.setAttribute("aria-pressed", S.mis.pick===el.getAttribute("data-v")); }); }
    else if(e.target.id==="ans"){ S.ppa.ans[DILEMMAS[S.ppa.i].id]=e.target.value; save(); }
  });
  document.addEventListener("change", function(e){
    if(e.target.id==="optShow"){ S.rev.show=e.target.checked; save(); renderStage(); }
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Enter" && e.target.id==="newName"){ e.preventDefault(); begin(); return; }
    if(view!=="session" || guide.open || e.ctrlKey || e.metaKey || e.altKey) return;
    var tag=(e.target && e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA") return;
    var k=e.key.length===1?e.key.toLowerCase():e.key, p=S.phase, a=null, v=null;
    if((p===0 || (p===4 && S.mstep===0)) && /^[1-5]$/.test(k)){ a="motor"; v=k; }
    else if(p===1 || p===2){
      if(k===" ") a="ok"; else if(k==="x") a="miss";
      else if(p===2){ a={ArrowUp:"go",ArrowDown:"stop",f:"fake",a:"auto",m:"micro"}[k]||null; }
      if(p===2 && (a==="ok"||a==="miss") && !S.sem.log.length) a=null;
    }
    else if(p===3 && k===" ") a="step";
    if(!a) return;
    e.preventDefault(); act(a, v);
  });
}

/* ---------- boot ---------- */
try{ var pr=JSON.parse(localStorage.getItem(PREFS)||"{}")||{}; if(pr.lang==="pt"||pr.lang==="en") L=pr.lang; }catch(e){}
saved=load();
bind(); applyTheme(); applyLang();
setInterval(function(){ if(view==="session"){ tick(); if(Math.floor(Date.now()/1000)%5===0) save(); } }, 1000);
})();
</script>
