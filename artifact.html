<title>Mapa do Explorador</title>
<meta name="description" content="Jogo de memória de trabalho e planejamento para 6–12 anos: guardar a sequência, traçar a rota, conversar sobre a estratégia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
  :root{
    --sand:#FBF7F0; --surface:#FFFFFF; --surface-2:#F5EEE0;
    --ink:#28373E; --ink-soft:#5E6D72; --border:#EBE2D1;
    --teal:#3AA6A0; --teal-deep:#2E8A85; --coral:#F0956B; --gold:#E6B23C; --green:#7BB274; --sky:#6FB1E0; --night:#8E86C9;
    --primary:#2E8A85; --on-primary:#FFFFFF; --route:#D9674A;
    --tile:#F7F0E2; --tile-2:#F1E8D6; --tree:#DDEBD2;
    --ok-bg:#E4F1E0; --ok-line:#5E9E57; --bad-bg:#FCE7DC; --bad-line:#E07E55;
    --shadow:0 6px 18px rgba(40,55,62,.09); --shadow-lg:0 16px 40px rgba(40,55,62,.16);
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --sand:#131F1E; --surface:#1C2B29; --surface-2:#243634; --ink:#EAF2EF; --ink-soft:#A6BAB6; --border:#2E4340;
      --teal:#4FBDB6; --teal-deep:#6BD0C9; --coral:#F0A47F; --gold:#E0BE63; --green:#8FC787; --sky:#83BAE6; --night:#A79EDC;
      --primary:#5FC7C0; --on-primary:#0E1F1D; --route:#F0A47F;
      --tile:#20322F; --tile-2:#1C2C29; --tree:#1F3A2B;
      --ok-bg:#1F3A2B; --ok-line:#8FC787; --bad-bg:#3A2A22; --bad-line:#F0A47F;
      --shadow:0 6px 18px rgba(0,0,0,.32); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --sand:#131F1E; --surface:#1C2B29; --surface-2:#243634; --ink:#EAF2EF; --ink-soft:#A6BAB6; --border:#2E4340;
    --teal:#4FBDB6; --teal-deep:#6BD0C9; --coral:#F0A47F; --gold:#E0BE63; --green:#8FC787; --sky:#83BAE6; --night:#A79EDC;
    --primary:#5FC7C0; --on-primary:#0E1F1D; --route:#F0A47F;
    --tile:#20322F; --tile-2:#1C2C29; --tree:#1F3A2B;
    --ok-bg:#1F3A2B; --ok-line:#8FC787; --bad-bg:#3A2A22; --bad-line:#F0A47F;
    --shadow:0 6px 18px rgba(0,0,0,.32); --shadow-lg:0 16px 40px rgba(0,0,0,.45);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--sand); color:var(--ink); font-family:"Nunito",system-ui,-apple-system,sans-serif; font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:"Fredoka","Nunito",system-ui,sans-serif; font-weight:600; text-wrap:balance; margin:0}
  button{font:inherit; color:inherit}
  :focus-visible{outline:3px solid var(--sky); outline-offset:2px}

  .app{max-width:1100px; margin:0 auto; padding-inline:16px; padding-block:12px 36px}

  /* header */
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap}
  .brand{display:flex; align-items:center; gap:12px; min-width:0}
  .badge{width:48px; height:48px; flex:0 0 auto; border-radius:15px; background:var(--green); display:grid; place-items:center; font-size:1.6rem; box-shadow:var(--shadow)}
  .brand h1{font-size:1.4rem; line-height:1.15}
  .brand .sub{color:var(--ink-soft); font-weight:700; font-size:.85rem; font-variant-numeric:tabular-nums}
  .tools{display:flex; align-items:center; gap:8px}
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--border); border-radius:13px; padding:3px; gap:3px}
  .seg button{border:0; background:transparent; border-radius:10px; padding:6px 11px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:.85rem; cursor:pointer; color:var(--ink-soft)}
  .seg button.on, .seg button[aria-pressed="true"]{background:var(--primary); color:var(--on-primary)}
  .icon{border:1px solid var(--border); background:var(--surface); width:40px; height:40px; border-radius:12px; font-size:1rem; cursor:pointer; box-shadow:var(--shadow); display:grid; place-items:center}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:48px; padding:0 18px; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:14px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:1rem; cursor:pointer; box-shadow:var(--shadow); transition:transform .12s ease}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn:disabled{opacity:.45; cursor:default; box-shadow:none}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
  .btn.big{width:100%; min-height:58px; font-size:1.2rem; border-radius:16px}
  .btn.ghost{box-shadow:none; background:transparent}
  .btn.danger{background:var(--bad-line); border-color:var(--bad-line); color:#fff}
  .btn.small{min-height:40px; font-size:.9rem; padding:0 14px}
  .hide-narrow{display:inline}
  @media (max-width:520px){ .hide-narrow{display:none} }

  /* stage layout */
  .stage{display:grid; gap:16px; margin-top:16px; grid-template-areas:"mission" "board" "dock"}
  @media (min-width:900px){
    .stage{grid-template-columns:minmax(0,1fr) 380px; grid-template-rows:auto 1fr; grid-template-areas:"board mission" "board dock"; align-items:start; column-gap:28px}
  }
  .mission-box{grid-area:mission; display:flex; flex-direction:column; gap:10px}
  .boardwrap{grid-area:board; display:flex; justify-content:center}
  .dock{grid-area:dock; display:flex; flex-direction:column; gap:12px}

  /* mission strip */
  .mlabel{font-family:"Fredoka",sans-serif; font-weight:600; font-size:1rem; color:var(--ink-soft); text-align:center}
  @media (min-width:900px){ .mlabel{text-align:left} .mission{justify-content:flex-start!important} }
  .mission{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
  .slot{position:relative; width:70px; height:84px; border-radius:16px; background:var(--surface); border:2px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:var(--shadow); transition:border-color .2s, background .2s}
  .slot .num{position:absolute; top:4px; left:7px; font-family:"Fredoka",sans-serif; font-weight:700; font-size:.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums}
  .slot .em{font-size:2rem; line-height:1.1}
  .slot .nm{font-size:.7rem; font-weight:700; color:var(--ink-soft); max-width:64px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .slot.q{border-style:dashed; background:var(--surface-2); box-shadow:none}
  .slot.q .em{font-family:"Fredoka",sans-serif; font-weight:700; color:var(--ink-soft); font-size:1.7rem}
  .slot.ok{border-color:var(--ok-line); background:var(--ok-bg)}
  .slot.bad{border-color:var(--bad-line); background:var(--bad-bg)}
  .slot.pop{animation:pop .35s ease}
  .timer{height:8px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
  .timer i{display:block; height:100%; width:100%; background:var(--gold); border-radius:99px}

  /* board */
  .board{position:relative; width:min(100%, 68vh, 600px); aspect-ratio:1; display:grid; grid-template-columns:repeat(var(--n,5),1fr); border-radius:20px; overflow:hidden; border:2px solid var(--border); box-shadow:var(--shadow-lg); background:var(--tile); container-type:inline-size; touch-action:none; user-select:none; -webkit-user-select:none}
  .cell{position:relative; display:grid; place-items:center; background:var(--tile); box-shadow:inset 0 0 0 .5px var(--border); font-size:calc(100cqi / var(--n,5) * .5); line-height:1}
  .cell.alt{background:var(--tile-2)}
  .cell.tree{background:var(--tree)}
  .board.planning .cell{cursor:pointer}
  .board.planning .cell.tree{cursor:not-allowed}
  .cell.next::after{content:""; position:absolute; inset:12%; border-radius:28%; border:2px dashed color-mix(in srgb, var(--primary) 60%, transparent); pointer-events:none}
  .cell .tent{position:absolute; right:5%; bottom:4%; font-size:.5em}
  .item{display:inline-block; transition:transform .28s ease, opacity .28s ease}
  .item.got{transform:scale(.2) translateY(-40%); opacity:0}
  .cell.shake{animation:shake .35s ease}
  .route{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
  .route polyline{fill:none; stroke:var(--route); stroke-width:.09; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:.16 .13}
  .route circle{fill:var(--route); stroke:var(--surface); stroke-width:.05}
  .piece{position:absolute; left:0; top:0; width:calc(100% / var(--n,5)); height:calc(100% / var(--n,5)); display:grid; place-items:center; font-size:calc(100cqi / var(--n,5) * .6); line-height:1; pointer-events:none; z-index:2; transform:translate(calc(var(--x,0) * 100%), calc(var(--y,0) * 100%)); transition:transform .24s ease; filter:drop-shadow(0 3px 3px rgba(0,0,0,.22))}

  /* dock */
  .status{margin:0; min-height:1.5em; color:var(--ink-soft); font-weight:700; text-align:center}
  @media (min-width:900px){ .status{text-align:left} }
  .status.hint{color:var(--bad-line)}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); padding:18px; display:flex; flex-direction:column; gap:14px}
  .card h2{font-size:1.45rem}
  .card p{margin:0}
  .card .rule{color:var(--ink-soft); font-size:.92rem}
  .lbl{font-family:"Fredoka",sans-serif; font-weight:600; font-size:.9rem; color:var(--ink-soft)}
  .avatars{display:flex; flex-wrap:wrap; gap:8px}
  .av{width:52px; height:52px; border-radius:15px; border:2px solid var(--border); background:var(--surface-2); font-size:1.7rem; cursor:pointer; display:grid; place-items:center}
  .av.on{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 16%, var(--surface))}
  .ctrls{display:grid; grid-template-columns:repeat(auto-fit, minmax(110px, 1fr)); gap:8px}
  .energy{display:flex; flex-direction:column; gap:6px}
  .elabel{font-weight:700; font-variant-numeric:tabular-nums}
  .elabel b{font-family:"Fredoka",sans-serif; font-size:1.15rem}
  .ebar{height:12px; border-radius:99px; background:var(--surface-2); border:1px solid var(--border); overflow:hidden}
  .ebar i{display:block; height:100%; background:var(--green); border-radius:99px; transition:width .18s ease, background .18s}
  .energy.low .ebar i{background:var(--gold)}
  .energy.full .ebar i{background:var(--bad-line)}
  .energy.flash{animation:shake .35s ease}

  .stars{display:flex; gap:6px; justify-content:center}
  .stars svg{width:48px; height:48px}
  .stars polygon{fill:var(--border)}
  .stars .on polygon{fill:var(--gold)}
  .stars .on{animation:pop .45s ease both}
  .stars .on:nth-child(2){animation-delay:.12s}
  .stars .on:nth-child(3){animation-delay:.24s}
  .result h2{text-align:center}
  .checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .checks li{display:flex; gap:9px; align-items:flex-start; font-weight:600}
  .checks li::before{content:"✓"; flex:0 0 22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:.8rem; font-weight:800; background:var(--ok-bg); color:var(--ok-line); border:1.5px solid var(--ok-line)}
  .checks li.off{color:var(--ink-soft)}
  .checks li.off::before{content:""; background:transparent; border:1.5px dashed var(--border)}
  .cmp{display:flex; flex-direction:column; gap:8px}
  .cmp .row2{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .cmp .row2 span.k{font-weight:700; color:var(--ink-soft); font-size:.88rem; min-width:9ch}
  .mini{display:inline-grid; place-items:center; width:40px; height:40px; border-radius:11px; border:2px solid var(--border); background:var(--surface-2); font-size:1.3rem}
  .mini.ok{border-color:var(--ok-line); background:var(--ok-bg)}
  .mini.bad{border-color:var(--bad-line); background:var(--bad-bg)}
  .lvlmsg{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--primary); text-align:center}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{border:1.5px solid var(--border); background:var(--surface-2); border-radius:999px; padding:7px 13px; font-family:"Fredoka",sans-serif; font-weight:600; font-size:.88rem; cursor:pointer}
  .chip.on{background:var(--primary); border-color:var(--primary); color:var(--on-primary)}
  .talk{background:color-mix(in srgb, var(--night) 14%, var(--surface)); border-radius:14px; padding:12px 14px; font-size:.95rem}
  .talk b{display:block; font-family:"Fredoka",sans-serif; font-weight:600; color:var(--night); font-size:.82rem; letter-spacing:.03em; text-transform:uppercase; margin-bottom:2px}
  .btnrow{display:flex; flex-wrap:wrap; gap:8px}
  .btnrow .btn{flex:1 1 180px}

  /* who's playing */
  .plist{display:flex; flex-direction:column; gap:8px}
  .pbtn{display:flex; align-items:center; gap:12px; text-align:left; padding:10px 12px; border-radius:16px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer; min-height:60px}
  .pbtn:hover{border-color:var(--primary)}
  .pbtn .pav{font-size:1.8rem; line-height:1}
  .pbtn b{font-family:"Fredoka",sans-serif; font-weight:600; display:block; font-size:1.05rem}
  .pbtn small{display:block; color:var(--ink-soft); font-weight:700; font-size:.8rem}
  .newp{display:flex; flex-direction:column; gap:10px; border-top:1px solid var(--border); padding-top:14px}
  .fl{font-weight:700; font-size:.9rem}
  input[type="text"]{width:100%; min-height:48px; font:inherit; font-size:1.05rem; padding:0 14px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); color:var(--ink)}
  input[type="text"]:focus{border-color:var(--primary); outline:none}
  .linkbtn{border:0; background:none; padding:0; color:var(--primary); font-weight:800; text-decoration:underline; cursor:pointer}
  .who-line{font-size:.9rem; color:var(--ink-soft); font-weight:700}

  /* therapist panel */
  dialog{border:1px solid var(--border); border-radius:22px; background:var(--surface); color:var(--ink); padding:0; width:min(700px, calc(100% - 32px)); max-height:calc(100% - 48px); box-shadow:var(--shadow-lg); overflow:auto}
  dialog::backdrop{background:rgba(18,28,28,.5)}
  .phead{position:sticky; top:0; z-index:1; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; background:var(--surface); border-bottom:1px solid var(--border)}
  .phead h2{font-size:1.3rem}
  .pbody{padding:18px; display:flex; flex-direction:column; gap:14px}
  .pbody h3{font-size:1.08rem; margin-top:8px}
  .pbody h4{font-size:.95rem; color:var(--ink-soft)}
  .pbody p{margin:0}
  .intro{color:var(--ink-soft); max-width:62ch}
  .fine{color:var(--ink-soft); font-size:.85rem}
  .levels{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px}
  .lvl{text-align:left; padding:10px 12px; border-radius:14px; border:1.5px solid var(--border); background:var(--surface-2); cursor:pointer}
  .lvl b{font-family:"Fredoka",sans-serif; font-weight:600; display:block}
  .lvl small{display:block; color:var(--ink-soft); font-size:.78rem; font-variant-numeric:tabular-nums}
  .lvl.on{border-color:var(--primary); background:color-mix(in srgb, var(--primary) 15%, var(--surface))}
  .toggle{display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-weight:600}
  .toggle input{width:20px; height:20px; margin:2px 0 0; accent-color:var(--primary); flex:0 0 auto}
  .seg.wide{flex-wrap:wrap}
  .seg.wide button{padding:8px 13px}
  .stats{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2, 1fr)} }
  .stat{background:var(--surface-2); border-radius:14px; padding:10px 12px}
  .stat b{display:block; font-family:"Fredoka",sans-serif; font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
  .stat span{font-size:.8rem; color:var(--ink-soft); font-weight:700}
  .tbl{overflow-x:auto; border:1px solid var(--border); border-radius:14px}
  table{border-collapse:collapse; width:100%; font-size:.86rem}
  th,td{padding:8px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--border); font-variant-numeric:tabular-nums}
  th{font-family:"Fredoka",sans-serif; font-weight:600; color:var(--ink-soft); background:var(--surface-2)}
  tr:last-child td{border-bottom:0}
  .pill{display:inline-block; padding:2px 9px; border-radius:999px; font-weight:700; font-size:.78rem}
  .pill.win{background:var(--ok-bg); color:var(--ok-line)}
  .pill.fail{background:var(--bad-bg); color:var(--bad-line)}
  textarea{width:100%; font:inherit; font-size:.85rem; border:1px solid var(--border); border-radius:12px; background:var(--surface-2); color:var(--ink); padding:10px}
  .confirm{border:1.5px solid var(--bad-line); border-radius:14px; padding:12px; display:flex; flex-direction:column; gap:10px; background:var(--bad-bg)}

  @keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important; transition-duration:0s!important}
  }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <span class="badge" aria-hidden="true">🗺️</span>
      <div>
        <h1 id="hTitle">Mapa do Explorador</h1>
        <div class="sub" id="hSub"></div>
      </div>
    </div>
    <div class="tools">
      <div class="seg" role="group" id="langSeg">
        <button id="lPT" type="button">PT</button>
        <button id="lEN" type="button">EN</button>
      </div>
      <button class="icon" id="themeBtn" type="button">🌙</button>
      <button class="btn small" id="panelBtn" type="button"><span aria-hidden="true">📋</span><span class="hide-narrow" data-t="therapist">Terapeuta</span></button>
    </div>
  </header>

  <main class="stage">
    <section class="mission-box">
      <div class="mlabel" id="mLabel"></div>
      <div class="mission" id="mission"></div>
      <div class="timer" id="timer" hidden><i id="timerFill"></i></div>
    </section>
    <div class="boardwrap"><div class="board" id="board" role="application"></div></div>
    <section class="dock">
      <p class="status" id="status" aria-live="polite"></p>
      <div id="dockBody"></div>
    </section>
  </main>
</div>

<dialog id="panel">
  <div class="phead">
    <h2 data-t="panelTitle">Painel do terapeuta</h2>
    <button class="icon" id="panelClose" type="button">✕</button>
  </div>
  <div class="pbody" id="panelBody"></div>
</dialog>

<script>
(function(){
"use strict";

var ITEMS=[
  {e:"🍎",pt:"maçã",en:"apple"},{e:"🔑",pt:"chave",en:"key"},{e:"🐚",pt:"concha",en:"shell"},
  {e:"⭐",pt:"estrela",en:"star"},{e:"🍄",pt:"cogumelo",en:"mushroom"},{e:"💎",pt:"diamante",en:"gem"},
  {e:"🥕",pt:"cenoura",en:"carrot"},{e:"🌻",pt:"girassol",en:"sunflower"},{e:"🎈",pt:"balão",en:"balloon"},
  {e:"🍯",pt:"mel",en:"honey"},{e:"🦋",pt:"borboleta",en:"butterfly"},{e:"🔔",pt:"sino",en:"bell"}
];
var AVATARS=["🦊","🐼","🐸","🐯","🦉","🐧"];
// n = grid size, seq = items to remember, mem = seconds to memorise, obs = trees, dec = distractor items, slack = extra steps over the shortest route
var LEVELS=[
  {n:4,seq:2,mem:6, obs:1,dec:0,slack:4},
  {n:5,seq:2,mem:6, obs:3,dec:1,slack:3},
  {n:5,seq:3,mem:7, obs:3,dec:1,slack:3},
  {n:5,seq:3,mem:7, obs:4,dec:2,slack:2},
  {n:6,seq:4,mem:8, obs:5,dec:2,slack:2},
  {n:6,seq:4,mem:8, obs:6,dec:3,slack:1},
  {n:6,seq:5,mem:9, obs:6,dec:3,slack:1},
  {n:7,seq:6,mem:10,obs:8,dec:4,slack:1}
];
var STRATS=[
  {id:"voice",  e:"🗣️", pt:"Falei em voz alta",            en:"Said it out loud"},
  {id:"story",  e:"📖", pt:"Inventei uma história",        en:"Made up a story"},
  {id:"fingers",e:"✋", pt:"Contei nos dedos",             en:"Counted on my fingers"},
  {id:"route",  e:"🧠", pt:"Imaginei o caminho",           en:"Pictured the route in my head"},
  {id:"look",   e:"👀", pt:"Olhei onde cada coisa estava", en:"Looked where each thing was"},
  {id:"try",    e:"🎲", pt:"Fui tentando",                 en:"Just tried it"}
];
var QUESTIONS={
  pt:["Como você fez pra lembrar a ordem?",

function loadDB(){

function cleanProfile(p){
  if(!p || typeof p.id!=="string" || typeof p.name!=="string" || !Array.isArray(p.sessions)) return null;
  return {id:p.id, name:p.name.slice(0,30), avatar:AVATARS[p.avatar]?p.avatar:0, created:+p.created||Date.now(),
    level:Math.max(0, Math.min(LEVELS.length-1, parseInt(p.level,10)||0)),
    settings:Object.assign(defaultSettings(), p.settings||{}),
    sessions:p.sessions.filter(function(s){ return s && Array.isArray(s.log); }).map(function(s){
      return {id:String(s.id||uid()), start:+s.start||Date.now(), last:+s.last||+s.start||Date.now(), levelStart:+s.levelStart||1, levelEnd:+s.levelEnd||+s.levelStart||1,
        log:s.log.filter(function(e){ return e && typeof e==="object"; }).map(function(e){ return Object.assign({}, e, {strategies:Array.isArray(e.strategies)?e.strategies:[]}); })};
    })};
}
function playedSessions(p){ return p.sessions.filter(function(s){ return s.log.length; }); }
// Reuse the last session if it's empty or the patient came back within SESSION_GAP; otherwise start a new one.
function openSession(p, forceNew){
  var last=p.sessions[p.sessions.length-1], now=Date.now();
  if(last && !last.log.length){ last.start=last.last=now; last.levelStart=last.levelEnd=p.level+1; return last; }
  if(last && !forceNew && now-last.last<SESSION_GAP) return last;
  var s={id:uid(), start:now, last:now, levelStart:p.level+1, levelEnd:p.level+1, log:[]};
  p.sessions.push(s); return s;
}
function usePatient(p, forceNew){

  else { SES={start:Date.now(), log:[]}; DB.current=null; S.level=0; S.settings=defaultSettings(); }
  S.log=SES.log; S.round=SES.log.length; S.up=0; S.down=0;

function doImport(file){
  var fr=new FileReader(), msg=function(s){ var el=$("#dataMsg"); if(el) el.textContent=s; };
  fr.onload=function(){
    var n=0;
    try{
      var d=JSON.parse(fr.result); if(!d || !Array.isArray(d.profiles)) throw new Error("bad");
      d.profiles.forEach(function(raw){
        var p=cleanProfile(raw); if(!p) return;
        var i=DB.profiles.findIndex(function(x){ return x.id===p.id; });
        if(i>=0) DB.profiles[i]=p; else DB.profiles.push(p);
        n++;
      });
      if(!n) throw new Error("empty");
    }catch(e){ msg(t("importFail")); return; }
    saveDB();
    if(P){ var cur=DB.profiles.find(function(x){ return x.id===P.id; }); if(cur!==P) usePatient(cur,false); }
    else if(R.phase==="who") renderDock();
    renderPanel(); msg(t("imported",{n:n}));
  };
  fr.onerror=function(){ msg(t("importFail")); };
  fr.readAsText(file);
}

/* ---------- grid maths ---------- */
function rc(i,n){ return [i%n, Math.floor(i/n)]; }
function adj(a,b,n){ var p=rc(a,n), q=rc(b,n); return Math.abs(p[0]-q[0])+Math.abs(p[1]-q[1])===1; }
function neighbors(i,n){ var p=rc(i,n), o=[]; if(p[0]>0)o.push(i-1); if(p[0]<n-1)o.push(i+1); if(p[1]>0)o.push(i-n); if(p[1]<n-1)o.push(i+n); return o; }
function bfs(n,from,to,blocked){
  if(from===to) return 0;
  var dist={}; dist[from]=0; var q=[from];
  while(q.length){
    var c=q.shift(), nb=neighbors(c,n);
    for(var k=0;k<nb.length;k++){
      var x=nb[k]; if(dist[x]!=null || blocked.has(x)) continue;
      dist[x]=dist[c]+1; if(x===to) return dist[x]; q.push(x);
    }
  }
  return null;
}
// Shortest route that collects targets in order without stepping on distractors or future targets.
function optimal(m){
  var total=0, cur=m.start;
  for(var i=0;i<m.targets.length;i++){
    var blocked=new Set(m.obstacles);
    m.decoys.forEach(function(d){ blocked.add(d.cell); });
    for(var j=i+1;j<m.targets.length;j++) blocked.add(m.targets[j].cell);
    var d=bfs(m.n,cur,m.targets[i].cell,blocked);
    if(d==null) return null;
    total+=d; cur=m.targets[i].cell;
  }
  return total;
}
function genMap(lvl){
  var L=LEVELS[lvl];
  for(var tries=0;tries<300;tries++){
    var cs=shuffle(range(L.n*L.n)), k=0;
    var m={n:L.n, lvl:lvl, start:cs[k++], obstacles:new Set(), targets:[], decoys:[], itemAt:new Map()};
    for(var o=0;o<L.obs;o++) m.obstacles.add(cs[k++]);
    var pool=shuffle(range(ITEMS.length));
    for(var i=0;i<L.seq;i++) m.targets.push({cell:cs[k++], item:pool[i], idx:i});
    for(var d=0;d<L.dec;d++) m.decoys.push({cell:cs[k++], item:pool[L.seq+d]});
    var opt=optimal(m);
    if(opt==null || opt<L.seq+1) continue;
    m.opt=opt; m.budget=opt+L.slack;
    m.targets.forEach(function(x){ m.itemAt.set(x.cell,{item:x.item, kind:"target", idx:x.idx}); });
    m.decoys.forEach(function(x){ m.itemAt.set(x.cell,{item:x.item, kind:"decoy"}); });
    return m;
  }
  return null;
}

/* ---------- rounds ---------- */
function newRound(retry){
  clearTimeout(memT); clearTimeout(peekT); clearTimeout(hintT);
  var map = (retry && R) ? R.map : genMap(S.level);
  S.round++;
  R={map:map, phase:"ready", path:[map.start], peeks:0, peeking:false, collected:[], got:new Set(), retry:!!retry, result:null, hint:""};
  $("#timer").hidden=true;
  renderBoard(); renderAll();
}
function startMemorize(){
  R.phase="memorize"; renderAll();
  if(S.settings.mem==="free") return;
  var secs=LEVELS[R.map.lvl].mem*(S.settings.mem==="more"?1.5:1);
  var timer=$("#timer"), fill=$("#timerFill");
  timer.hidden=false;
  fill.style.transition="none"; fill.style.width="100%"; void fill.offsetWidth;
  fill.style.transition="width "+secs+"s linear"; fill.style.width="0%";
  memT=setTimeout(startPlan, secs*1000);
}
function startPlan(){
  clearTimeout(memT); $("#timer").hidden=true;
  if(R.phase!=="memorize") return;
  R.phase="plan"; renderAll();
}
function doPeek(){
  if(R.phase!=="plan" || R.peeking) return;
  R.peeking=true; R.peeks++; updateMission(); renderDock();
  var token=R;
  peekT=setTimeout(function(){ if(R!==token) return; R.peeking=false; updateMission(); renderDock(); }, 1800);
}
function walk(){
  clearTimeout(peekT); R.peeking=false;
  R.phase="walk"; renderAll();
  var token=R, m=R.map, next=0, k=1;
  (function stepLoop(){
    if(R!==token) return;
    if(k>=R.path.length){ sleep(400).then(function(){ if(R===token) finish(); }); return; }
    var c=R.path[k++];
    movePiece(c,false);
    var it=m.itemAt.get(c);
    if(it && !R.got.has(c)){
      R.got.add(c);
      var ok = it.kind==="target" && it.idx===next;
      if(ok) next++;
      R.collected.push({item:it.item, ok:ok});
      var el=cells[c].querySelector(".item"); if(el) el.classList.add("got");
      updateMission(true);
    }
    setTimeout(stepLoop, reduced?140:280);
  })();
}
function finish(){
  var m=R.map, steps=R.path.length-1;
  var success = R.collected.length===m.targets.length && R.collected.every(function(c){ return c.ok; });
  var eff = steps<=m.opt+1;
  var stars = success ? 1+(R.peeks===0?1:0)+(eff?1:0) : 0;
  var entry={level:m.lvl+1, items:m.targets.length, success:success, steps:steps, opt:m.opt, peeks:R.peeks, strategies:[], retry:R.retry};
  S.log.push(entry);
  var lvlMsg=null;
  if(S.settings.auto){
    if(success){ S.up++; S.down=0; if(S.up>=2 && S.level<LEVELS.length-1){ S.level++; S.up=0; lvlMsg={k:"levelUp", l:S.level+1}; } }
    else { S.down++; S.up=0; if(S.down>=2 && S.level>0){ S.level--; S.down=0; lvlMsg={k:"levelDown", l:S.level+1}; } }
  }
  persist();
  R.result={success:success, stars:stars, steps:steps, eff:eff, entry:entry, lvlMsg:lvlMsg, q:(S.log.length-1)%QUESTIONS.pt.length};
  R.phase="result"; renderAll();
  if(window.innerWidth<900){ var d=$("#dockBody"); if(d.scrollIntoView) d.scrollIntoView({behavior:reduced?"auto":"smooth", block:"nearest"}); }
}

/* ---------- planning input ---------- */
function stepTo(c){
  var m=R.map, p=R.path;
  if(m.obstacles.has(c)) return "tree";
  if(p.length-1>=m.budget) return "energy";
  p.push(c); return "ok";
}
function tryCell(c, fromDrag){
  if(R.phase!=="plan") return "off";
  var m=R.map, p=R.path, last=p[p.length-1], res;
  if(c===last) return "same";
  // Every tap/drag adds steps, including walking back the way you came (needed to leave dead ends).
  // Removing steps is only done with Undo / Clear / Backspace.
  if(adj(last,c,m.n)) res=stepTo(c);
  else {
    var a=rc(last,m.n), b=rc(c,m.n);
    if(a[0]===b[0] || a[1]===b[1]){
      var dx=Math.sign(b[0]-a[0]), dy=Math.sign(b[1]-a[1]), cur=last; res="ok";
      while(cur!==c){
        var q=rc(cur,m.n), nc=(q[1]+dy)*m.n+(q[0]+dx);
        res=stepTo(nc); if(res!=="ok"){ c=nc; break; }
        cur=R.path[R.path.length-1]; if(cur!==nc) break;
      }
    } else res="adj";
  }
  if(res==="ok"){ clearHint(); updateRoute(); updatePlan(); }
  else {
    if(res==="tree"){ shake(cells[c]); showHint("hintTree"); }
    else if(res==="energy"){ shake($("#energy")); showHint("hintEnergy"); }
    else if(!fromDrag) showHint("hintAdj");
    if(res!=="ok"){ updateRoute(); updatePlan(); }
  }
  return res;
}
function shake(el){ if(!el) return; el.classList.remove("shake","flash"); void el.offsetWidth; el.classList.add(el.id==="energy"?"flash":"shake"); }
function showHint(k){ clearTimeout(hintT); R.hint=k; setStatus(); hintT=setTimeout(function(){ if(R){ R.hint=""; setStatus(); } }, 3200); }
function clearHint(){ if(R.hint){ clearTimeout(hintT); R.hint=""; setStatus(); } }

function renderBoard(){
  var m=R.map, b=$("#board"), h="";
  b.style.setProperty("--n", m.n);
  for(var i=0;i<m.n*m.n;i++){
    var p=rc(i,m.n), cls="cell"+((p[0]+p[1])%2?" alt":""), inner="";
    if(m.obstacles.has(i)){ cls+=" tree"; inner=(i%2?"🌲":"🌳"); }
    else if(m.itemAt.has(i)){ var it=m.itemAt.get(i); inner='<span class="item" role="img" aria-label="'+itemName(it.item)+'">'+ITEMS[it.item].e+'</span>'; }
    if(i===m.start) inner='<span class="tent" aria-hidden="true">⛺</span>';
    h+='<div class="'+cls+'" data-i="'+i+'">'+inner+'</div>';
  }
  h+='<svg class="route" viewBox="0 0 '+m.n+' '+m.n+'" preserveAspectRatio="none" aria-hidden="true"><polyline id="routeLine" points=""></polyline><circle id="routeEnd" r=".16" cx="0" cy="0"></circle></svg>';
  h+='<div class="piece" id="piece" aria-hidden="true">'+AVATARS[S.avatar]+'</div>';

function movePiece(c,instant){
  var p=$("#piece"), q=rc(c,R.map.n);

function updateRoute(){
  var m=R.map, line=$("#routeLine"), end=$("#routeEnd");
  line.setAttribute("points", R.path.map(function(c){ var q=rc(c,m.n); return (q[0]+.5)+","+(q[1]+.5); }).join(" "));
  var last=R.path[R.path.length-1], q=rc(last,m.n);
  end.setAttribute("cx",q[0]+.5); end.setAttribute("cy",q[1]+.5);

  cells.forEach(function(el){ el.classList.remove("next"); });
  if(R.phase==="plan" && R.path.length-1<m.budget){
    neighbors(last,m.n).forEach(function(nb){ if(!m.obstacles.has(nb)) cells[nb].classList.add("next"); });

  $("#panelBtn").setAttribute("aria-label",t("panelTitle"));
  $("#panelClose").setAttribute("aria-label",t("close"));
  $("#langSeg").setAttribute("aria-label",t("langAria"));
  $("#lPT").setAttribute("aria-pressed", S.lang==="pt"); $("#lEN").setAttribute("aria-pressed", S.lang==="en");
  $("#board").setAttribute("aria-label", t("boardAria",{n:R.map.n}));
  cells.forEach(function(el){ var it=el.querySelector(".item"); if(it){ var x=R.map.itemAt.get(+el.dataset.i); it.setAttribute("aria-label", itemName(x.item)); } });
  renderAll();
  if($("#panel").open) renderPanel();
}
function setLang(l){ if(S.lang===l) return; S.lang=l; savePrefs(); applyLang(); }

/* ---------- events ---------- */
function bind(){
  $("#lPT").addEventListener("click", function(){ setLang("pt"); });
  $("#lEN").addEventListener("click", function(){ setLang("en"); });
  $("#themeBtn").addEventListener("click", toggleTheme);
  var panel=$("#panel");
  $("#panelBtn").addEventListener("click", function(){ renderPanel(); if(panel.showModal) panel.showModal(); else panel.setAttribute("open",""); });
  $("#panelClose").addEventListener("click", function(){ panel.close(); });
  panel.addEventListener("click", function(e){ if(e.target===panel) panel.close(); });

  $("#dockBody").addEventListener("click", function(e){
    var b=e.target.closest("[data-act]"); if(!b || b.disabled) return;
    var act=b.getAttribute("data-act"), v=b.getAttribute("data-v");
    if(act==="avatar"){ S.avatar=+v; savePrefs(); persist(); $("#piece").textContent=AVATARS[S.avatar]; renderDock(); }
    else if(act==="pick"){ var p=DB.profiles.find(function(x){ return x.id===v; }); if(p) usePatient(p,false); }
    else if(act==="newav"){ newAv=+v; Array.prototype.forEach.call(document.querySelectorAll('[data-act="newav"]'), function(el){ var on=+el.getAttribute("data-v")===newAv; el.classList.toggle("on",on); el.setAttribute("aria-pressed",on); }); }
    else if(act==="create") createPatient();
    else if(act==="guest") usePatient(null);
    else if(act==="switch") goWho();
    else if(act==="show") startMemorize();
    else if(act==="gotit") startPlan();
    else if(act==="undo"){ if(R.path.length>1){ R.path.pop(); clearHint(); updateRoute(); updatePlan(); } }
    else if(act==="clear"){ R.path.length=1; clearHint(); updateRoute(); updatePlan(); }
    else if(act==="peek") doPeek();
    else if(act==="go"){ if(R.path.length>1) walk(); }
    else if(act==="strat"){
      var list=R.result.entry.strategies, i=list.indexOf(v);
      if(i>=0) list.splice(i,1); else list.push(v);
      b.classList.toggle("on", i<0); b.setAttribute("aria-pressed", i<0);
      persist();
    }
    else if(act==="retry") newRound(true);
    else if(act==="next") newRound(false);
  });

  $("#panelBody").addEventListener("click", function(e){
    var b=e.target.closest("[data-act]"); if(!b) return;
    var act=b.getAttribute("data-act"), v=b.getAttribute("data-v");
    if(act==="level"){ S.level=+v; S.up=0; S.down=0; persist(); if(R.phase==="ready"){ S.round--; newRound(false); } renderPanel(); }
    else if(act==="mem"){ S.settings.mem=v; persist(); renderPanel(); setStatus(); }
    else if(act==="copy") doCopy();
    else if(act==="new"){ $("#confirmBox").hidden=false; }
    else if(act==="newNo"){ $("#confirmBox").hidden=true; }
    else if(act==="newYes"){ usePatient(P, true); renderPanel(); }
    else if(act==="switch"){ panel.close(); goWho(); }
    else if(act==="export") doExport();
    else if(act==="import") $("#importFile").click();
    else if(act==="del"){ $("#delBox").hidden=false; }
    else if(act==="delNo"){ $("#delBox").hidden=true; }
    else if(act==="delYes"){
      var id=P.id; DB.profiles=DB.profiles.filter(function(x){ return x.id!==id; });
      P=null; DB.current=null; saveDB(); panel.close(); goWho();
    }
  });
  $("#panelBody").addEventListener("change", function(e){
    if(e.target.id==="optAuto"){ S.settings.auto=e.target.checked; persist(); }
    else if(e.target.id==="optPeek"){ S.settings.peek=e.target.checked; persist(); if(R.phase==="plan") renderDock(); }
    else if(e.target.id==="importFile" && e.target.files && e.target.files[0]){ doImport(e.target.files[0]); e.target.value=""; }
  });
  $("#dockBody").addEventListener("keydown", function(e){
    if(e.target.id==="newName" && e.key==="Enter"){ e.preventDefault(); createPatient(); }
  });

  var board=$("#board"), dragging=false, lastCell=null;
  function cellAt(e){ var el=document.elementFromPoint(e.clientX,e.clientY); el=el && el.closest ? el.closest(".cell") : null; return el && board.contains(el) ? +el.getAttribute("data-i") : null; }
  board.addEventListener("pointerdown", function(e){
    if(R.phase!=="plan") return;
    e.preventDefault(); dragging=true; lastCell=null;
    try{ board.setPointerCapture(e.pointerId); }catch(err){}
    var c=cellAt(e); if(c==null) return;
    tryCell(c,false); lastCell=c;
  });
  board.addEventListener("pointermove", function(e){
    if(!dragging || R.phase!=="plan") return;
    var c=cellAt(e); if(c==null || c===lastCell) return;
    var res=tryCell(c,true);
    if(res!=="adj") lastCell=c;
  });
  function stop(){ dragging=false; lastCell=null; }
  board.addEventListener("pointerup", stop); board.addEventListener("pointercancel", stop);

  document.addEventListener("keydown", function(e){
    if(panel.open || !R || R.phase!=="plan") return;
    var tag=(e.target && e.target.tagName)||""; if(tag==="INPUT"||tag==="TEXTAREA") return;
    var m=R.map, last=R.path[R.path.length-1], q=rc(last,m.n), nc=null;
    if(e.key==="ArrowLeft" && q[0]>0) nc=last-1;
    else if(e.key==="ArrowRight" && q[0]<m.n-1) nc=last+1;
    else if(e.key==="ArrowUp" && q[1]>0) nc=last-m.n;
    else if(e.key==="ArrowDown" && q[1]<m.n-1) nc=last+m.n;
    else if(e.key==="Backspace"){ e.preventDefault(); if(R.path.length>1){ R.path.pop(); clearHint(); updateRoute(); updatePlan(); } return; }
    else if(e.key==="Enter" && tag!=="BUTTON"){ if(R.path.length>1){ e.preventDefault(); walk(); } return; }
    else return;
    e.preventDefault();
    if(nc!=null) tryCell(nc,false);
  });
}

/* ---------- boot ---------- */
function start(){
  S=defaults();
  var prefs=loadPrefs();
  if(prefs.lang==="pt"||prefs.lang==="en") S.lang=prefs.lang;
  if(typeof prefs.avatar==="number" && AVATARS[prefs.avatar]) S.avatar=prefs.avatar;
  newAv=S.avatar;
  loadDB(); bind(); applyTheme();
  SES={start:Date.now(), log:S.log};
  // One saved patient on this device (e.g. a child's own tablet): resume them. Several: ask who's playing.
  if(DB.profiles.length===1) usePatient(DB.profiles[0], false);
  else goWho();
  applyLang();
}
start();
})();
</script>
